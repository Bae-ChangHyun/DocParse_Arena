services:
  docparse-arena:
    build: .
    ports:
      - "${APP_PORT:-3000}:${PORT:-3000}"
    # Lets the container reach host-served local model servers (e.g. vLLM via
    # llmux on the host) at http://host.docker.internal:<port>.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - docparse-data:/app/data
      - ./backend/sample_docs:/app/backend/sample_docs
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/docparse_arena.db
      PORT: "${PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-3000}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  docparse-data:
